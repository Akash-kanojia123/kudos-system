<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Review Kudos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="extract-form.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-icon">🏆</div>
      <h1>Review & Send Kudos</h1>
      <p>Review, edit, and send to your Team Manager</p>
    </header>

    <div class="card">
      <h2>📧 Client Information</h2>
      <p class="hint" style="color:#f44336;">⚠️ Verify these details — auto-detection may not be perfect</p>

      <label>Client Name <span style="color:#8b93a7;font-weight:400;">(optional)</span></label>
      <input id="senderName" placeholder="Leave empty if not mentioned in email">

      <label>Client Email <span style="color:#8b93a7;font-weight:400;">(optional)</span></label>
      <input id="senderEmail" placeholder="Client email (if known)">

      <label>Subject</label>
      <input id="subject" placeholder="Email subject">

      <label>Your Team <span style="color:#f44336;">*</span></label>
      <input id="team" placeholder="e.g., Analytics">

      <label>Team Manager Email <span style="color:#f44336;">*</span></label>
      <input id="teamManagerEmail" placeholder="tm@grazitti.com">
    </div>

    <div class="card">
      <h2>💬 Message</h2>
      <p class="hint">The cleaned email body. Edit as needed.</p>
      <textarea id="message" rows="10"></textarea>
    </div>

    <div class="card">
      <h2>👥 Team Members</h2>
      <p class="hint">Auto-detected from email. Add more if names are missing.</p>
      <div id="members"></div>
      <button type="button" id="addMemberBtn" class="add-member">+ Add Member</button>
    </div>

    <div class="actions">
      <button type="button" id="cancelBtn" class="btn-cancel">Cancel</button>
      <button type="button" id="sendTmBtn" class="btn-submit">📤 Send to TM</button>
    </div>

    <div id="msg" class="msg"></div>
  </div>

  <script src="extract-form.js"></script>
</body>
</html>
