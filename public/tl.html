<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TL Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; padding:30px 20px; }
    .wrap { max-width:1000px; margin:0 auto; }

    .header { background:rgba(255,255,255,0.12); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.2); border-radius:20px; padding:25px 30px; color:#fff; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; }
    .header h1 { font-size:24px; font-weight:800; letter-spacing:-0.5px; }
    .header p { font-size:13px; opacity:0.85; margin-top:4px; }
    .header input { padding:11px 15px; border:none; border-radius:10px; font-size:14px; width:260px; font-family:'Inter',sans-serif; }

    .card { background:#fff; border-radius:20px; padding:28px 32px; margin-bottom:18px; box-shadow:0 15px 40px rgba(0,0,0,0.15); }
    .card h2 { font-size:18px; font-weight:800; color:#1a1f36; margin-bottom:18px; }

    .k { background:linear-gradient(135deg,#f8f9fc,#f0f3f9); border-left:4px solid #667eea; padding:20px 24px; border-radius:14px; margin-bottom:14px; transition:transform 0.2s; }
    .k:hover { transform:translateX(4px); }
    .k-header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
    .k .client { font-weight:700; color:#1a1f36; font-size:16px; }
    .k .sub { color:#8b93a7; font-size:12.5px; margin-top:2px; }
    .k .msg { color:#555; font-style:italic; margin:12px 0; font-size:14px; line-height:1.6; padding:12px; background:#fff; border-radius:8px; }
    .k .members { margin:10px 0; }
    .k .member-row { padding:6px 0; font-size:13px; color:#333; border-bottom:1px solid #eee; }
    .k .member-row b { color:#1a1f36; }
    .k .member-role { color:#667eea; font-size:12px; }
    .k .member-contrib { color:#555; font-size:12.5px; margin-top:3px; font-style:italic; }

    .actions { margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; }

    button { padding:11px 20px; border:none; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; transition:all 0.2s; }
    .edit { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; }
    .send { background:linear-gradient(135deg,#4CAF50,#2e7d32); color:#fff; }
    button:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(0,0,0,0.15); }

    .status { padding:5px 14px; border-radius:20px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap; }
    .tl_review { background:#fff3cd; color:#856404; }
    .tm_pending { background:#cce5ff; color:#004085; }
    .tm_approved { background:#d4edda; color:#155724; }
    .tm_rejected { background:#f8d7da; color:#721c24; }
    .ceo_pending { background:#e7d8f9; color:#5a1a8f; }
    .ceo_approved { background:#d1f2eb; color:#0b5345; }
    .sent { background:#e2e3e5; color:#383d41; }

    .msg-box { padding:14px; border-radius:12px; margin-top:14px; display:none; font-size:14px; font-weight:600; text-align:center; }
    .ok { background:#e7f9ee; color:#1a7f47; }
    .err { background:#fdecef; color:#b91c32; }

    .empty { text-align:center; padding:40px 20px; color:#8b93a7; font-size:14px; }

    /* Modal */
    .modal-bg { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center; padding:20px; }
    .modal { background:#fff; border-radius:20px; padding:32px; max-width:700px; width:100%; max-height:90vh; overflow:auto; box-shadow:0 30px 80px rgba(0,0,0,0.4); }
    .modal h3 { margin-bottom:8px; font-size:20px; color:#1a1f36; }
    .modal .client-info { color:#666; font-size:13px; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid #eee; }
    .modal label { display:block; font-weight:700; color:#3d4560; font-size:13px; margin:16px 0 8px; }
    .modal textarea, .modal input { width:100%; padding:12px 14px; border:2px solid #e8ecf3; border-radius:10px; font-family:'Inter',sans-serif; font-size:14px; background:#fafbfd; transition:all 0.2s; }
    .modal textarea:focus, .modal input:focus { outline:none; border-color:#667eea; background:#fff; box-shadow:0 0 0 4px rgba(102,126,234,0.1); }
    .modal textarea { min-height:100px; resize:vertical; }
    .modal .member { background:#f8f9fc; padding:14px; border-radius:12px; margin-bottom:10px; }
    .modal .member-row { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:start; }
    .modal .member textarea { grid-column:1/-1; margin-top:8px; min-height:60px; }
    .modal .remove { background:#fee; color:#e63946; padding:10px 14px; font-size:16px; font-weight:bold; border-radius:8px; }
    .modal .add-member { background:#f0f3f9; color:#667eea; width:100%; padding:12px; margin-bottom:12px; border:2px dashed #c5cde0; border-radius:10px; font-weight:700; }
    .modal .btn-row { display:flex; gap:10px; margin-top:20px; }
    .modal .btn-save { background:linear-gradient(135deg,#4CAF50,#2e7d32); color:#fff; flex:1; padding:14px; font-size:15px; }
    .modal .btn-cancel { background:#eee; color:#333; padding:14px 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>🏆 TL Dashboard</h1>
        <p>Review kudos extracted from client emails</p>
      </div>
      <input id="tlEmail" placeholder="Enter your email" onchange="loadMy()">
    </div>

    <div class="card">
      <h2>My Kudos</h2>
      <div id="list"><div class="empty">Enter your email above to see your kudos.</div></div>
      <div id="msg" class="msg-box"></div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="modalBg" class="modal-bg">
    <div class="modal">
      <h3>✏️ Edit Kudos</h3>
      <div class="client-info" id="mClient"></div>

      <label>Message</label>
      <textarea id="mMessage"></textarea>

      <label>Team Members</label>
      <div id="mMembers"></div>
      <button class="add-member" onclick="addMemberRow()">+ Add Member</button>

      <div class="btn-row">
        <button class="btn-save" onclick="saveKudos()">💾 Save Changes</button>
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let currentId = null;

    async function loadMy() {
      const email = document.getElementById('tlEmail').value.trim();
      if (!email) return;

      const res = await fetch(`/api/tl/my/${encodeURIComponent(email)}`);
      const data = await res.json();

      const list = document.getElementById('list');
      if (data.count === 0) {
        list.innerHTML = '<div class="empty">No kudos yet. Use the Chrome extension on a client email.</div>';
        return;
      }

      list.innerHTML = '';
      data.kudos.forEach(k => {
        const membersHtml = (k.members || []).map(m => `
          <div class="member-row">
            <b>${m.name}</b>${m.role ? ' <span class="member-role">— ' + m.role + '</span>' : ''}
            ${m.contribution ? '<div class="member-contrib">' + m.contribution + '</div>' : ''}
          </div>
        `).join('');

        list.innerHTML += `
          <div class="k">
            <div class="k-header">
              <div>
                <div class="client">${k.clientName}</div>
                <div class="sub">${k.clientEmail || ''} • ${k.subject || 'No subject'}</div>
              </div>
              <span class="status ${k.status}">${k.status.replace(/_/g,' ')}</span>
            </div>
            <div class="msg">"${k.message.substring(0, 200)}${k.message.length > 200 ? '...' : ''}"</div>
            ${membersHtml ? '<div class="members">' + membersHtml + '</div>' : ''}
            <div class="sub">Team: ${k.team}</div>
            ${k.tmComment ? `<div class="sub" style="color:#b91c32;margin-top:8px;">⚠️ TM: ${k.tmComment}</div>` : ''}
            <div class="actions">
              ${(k.status === 'tl_review' || k.status === 'tm_rejected') ? `
                <button class="edit" onclick='openEdit(${JSON.stringify(k).replace(/'/g, "&#39;")})'>✏️ Edit</button>
                <button class="send" onclick="sendToTM('${k._id}')">📤 Send to TM</button>
              ` : ''}
            </div>
          </div>
        `;
      });
    }

    function openEdit(k) {
      currentId = k._id;
      document.getElementById('mClient').innerHTML = `Client: <b>${k.clientName}</b> • Team: <b>${k.team}</b>`;
      document.getElementById('mMessage').value = k.message;
      document.getElementById('mMembers').innerHTML = '';
      (k.members || []).forEach(m => addMemberRow(m.name, m.role, m.contribution));
      if (!k.members || k.members.length === 0) {
        addMemberRow(); addMemberRow();
      }
      document.getElementById('modalBg').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalBg').style.display = 'none';
    }

    function addMemberRow(name = '', role = '', contribution = '') {
      const div = document.createElement('div');
      div.className = 'member';
      div.innerHTML = `
        <div class="member-row">
          <input placeholder="Name" class="m-name" value="${name}">
          <input placeholder="Role (e.g., Lead Data Analyst)" class="m-role" value="${role}">
          <button class="remove" onclick="this.closest('.member').remove()">×</button>
        </div>
        <textarea placeholder="Contribution — For..." class="m-contribution">${contribution}</textarea>
      `;
      document.getElementById('mMembers').appendChild(div);
    }

    async function saveKudos() {
      const message = document.getElementById('mMessage').value.trim();
      const members = [];
      document.querySelectorAll('#mMembers .member').forEach(m => {
        const n = m.querySelector('.m-name').value.trim();
        const r = m.querySelector('.m-role').value.trim();
        const c = m.querySelector('.m-contribution').value.trim();
        if (n) members.push({ name: n, role: r, contribution: c });
      });

      const res = await fetch(`/api/tl/${currentId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, members })
      });

      if (res.ok) {
        closeModal();
        loadMy();
      } else {
        alert('Failed to save');
      }
    }

    async function sendToTM(id) {
      const res = await fetch(`/api/tl/send-to-tm/${id}`, { method: 'POST' });
      const data = await res.json();
      const msg = document.getElementById('msg');
      msg.style.display = 'block';
      msg.className = 'msg-box ' + (res.ok ? 'ok' : 'err');
      msg.textContent = res.ok ? '✅ Sent to Team Manager!' : '❌ ' + data.error;
      if (res.ok) loadMy();
      setTimeout(() => msg.style.display = 'none', 3500);
    }
  </script>
</body>
</html>
